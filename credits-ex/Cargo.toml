[package]
name = "credits-ex"
version = "1.0.0"
edition = "2024"
rust-version = "1.96"

[dependencies]
rand = "0.10.3"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "wav"] }
crossterm = { version = "0.29.0", default-features = false, features = ["windows"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Com", "Win32_System_Console", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
